version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: template_enterprise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_development
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: template_enterprise_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: template_enterprise_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_development
      JWT_SECRET: change-me-in-local-development-only
      JWT_EXPIRES_IN: 7d
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  # Builds via frontend/Dockerfile, which layers on the Colossus-internal Angular
  # base image (see that file's header) — reachable from the platform's own build
  # infra. Outside it, `docker compose up backend postgres` plus `npx ng serve`
  # (see README Local development) is the supported local frontend workflow.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: template_enterprise_frontend
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  pgadmin_data:
