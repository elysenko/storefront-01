server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Path-routed deploys serve this app behind a single leading path segment (the
  # deployment slug, e.g. /storefront-01/) that the ingress does not strip, so API
  # calls can arrive as either /api/... (root-served) or /<slug>/api/.... Proxy both.
  location ~ ^(?:/[^/]+)?/api/(.*)$ { proxy_pass http://backend:3000/api/$1; }

  # Static assets behind the same optional deployment-slug segment: try the asset
  # with the slug stripped, else fall back to the SPA shell.
  location ~ ^/([^/]+)/(.+)$ { try_files /$2 /index.html; }

  location / { try_files $uri $uri/ /index.html; }
}
